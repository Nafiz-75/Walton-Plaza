<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walton Plaza — A little smarter. A lot more home.</title>
    <meta name="description" content="An independent Walton Plaza redesign concept. Discover appliances, compare models and plan your home." />
    <meta name="theme-color" content="#0a1240" />
    <!-- Official Walton favicons (waltonbd.com) + home-screen icon built from the official emblem -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preload" as="image" href="./img/fc934d493c38-hd.webp" fetchpriority="high" />
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('walton-plaza-v2') || '{}').theme) || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-C-Od6eBM.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-BYqCGoBQ.js">
    <link rel="modulepreload" crossorigin href="./assets/catalogue-zR5A1hZx.js">
    <link rel="modulepreload" crossorigin href="./assets/gsap-BiKpgMyt.js">
    <link rel="modulepreload" crossorigin href="./assets/motion-DJj0-c7h.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BVmPVD7O.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Walton Plaza needs JavaScript to show the catalogue.</noscript>
    <div id="boot-hint" hidden style="max-width:560px;margin:12vh auto;padding:32px;font:16px/1.6 system-ui,sans-serif;color:#0d1533;background:#fff;border:1px solid #e1e6f1;border-radius:20px">
      <h1 style="font-size:22px;margin:0 0 8px">This is the source file, not the website</h1>
      <p style="margin:0 0 12px;color:#4d5880">It only runs through the dev server. To view the site:</p>
      <ul style="margin:0;padding-left:20px;color:#2a3459">
        <li>Open <b>walton-redesign/dist/index.html</b> (or <b>Open Walton Plaza.html</b> in the project folder), or</li>
        <li>run <code>npm run dev</code> in <code>walton-redesign</code> and open the address it prints.</li>
      </ul>
    </div>
    <script>
      // If the app never starts (e.g. this source file opened straight from disk), explain instead of showing a blank page.
      setTimeout(function () { var r = document.getElementById('root'); if (r && !r.children.length) document.getElementById('boot-hint').hidden = false }, 1500)
    </script>
  </body>
</html>
